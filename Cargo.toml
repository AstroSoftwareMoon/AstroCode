[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AstroSoftwareMoon/AstroCode"
rust-version = "1.82"

[workspace.dependencies]
astrodev-core = { path = "crates/astrodev-core" }
astrodev-providers = { path = "crates/astrodev-providers" }
astrodev-tools = { path = "crates/astrodev-tools" }
astrodev-tui = { path = "crates/astrodev-tui" }
astrodev-hardware = { path = "crates/astrodev-hardware" }
astrodev-installer = { path = "crates/astrodev-installer" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "6"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
similar = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
