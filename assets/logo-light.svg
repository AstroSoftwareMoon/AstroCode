<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AstroDev">
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <defs>
    <mask id="front-FFFFFF">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="132" fill="black"/>
    </mask>
    <mask id="back-FFFFFF">
      <rect width="512" height="512" fill="black"/>
      <rect x="0" y="256" width="512" height="256" fill="white" transform="rotate(-16 256 256)"/>
    </mask>
  </defs>
  <!-- órbita: por detrás del planeta sólo se ve fuera del círculo -->
  <ellipse cx="256" cy="256" rx="206" ry="58" fill="none" stroke="#0A0A0A" stroke-width="10"
           transform="rotate(-16 256 256)" mask="url(#front-FFFFFF)"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#0A0A0A" stroke-width="14"/>
  <!-- tramo delantero de la órbita, sobre el planeta -->
  <g mask="url(#back-FFFFFF)">
    <ellipse cx="256" cy="256" rx="206" ry="58" fill="none" stroke="#0A0A0A" stroke-width="10"
             transform="rotate(-16 256 256)"/>
  </g>
  <circle cx="452" cy="196" r="14" fill="#0A0A0A"/>
  <path d="M212 204 L248 238 L212 272" fill="none" stroke="#0A0A0A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="264" y1="272" x2="304" y2="272" stroke="#0A0A0A" stroke-width="16" stroke-linecap="round"/>
</svg>
